name: Deploy to Github Pages

on:
  push:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Get the code
        uses: actions/checkout@v7
      - name: Set Up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install packages
        run: npm ci
      - name: Build the game
        run: npm run build
      - name: Set up pages
        uses: actions/configure-pages@v6
      - name: Upload the build
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5
